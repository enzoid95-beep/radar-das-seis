name: Atualizar e publicar

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-das-seis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.salvar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar jogos encerrados
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 update_data.py

      - name: Salvar dados novos
        id: salvar
        run: |
          if git diff --quiet -- data.json; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Sem jogos novos."
          else
            git config user.name "radar-das-seis-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Atualiza dados $(date -u +'%d/%m %H:%M') UTC"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.mudou == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
